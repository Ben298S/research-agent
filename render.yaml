services:
  - type: web
    name: research-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: PWA_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: daily-research
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: PWA_SECRET
        sync: false
    startCommand: curl --fail --silent --show-error -X POST "https://research-agent-7ken.onrender.com/run?key=${PWA_SECRET}"
